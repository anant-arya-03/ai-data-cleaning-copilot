services:
  - type: web
    name: ai-copilot-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13

  - type: web
    name: ai-copilot-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: ai-copilot-backend
          type: web
          property: host
        # The line above pulls the host of the backend dynamically.
        # But VITE_API_URL needs the https:// protocol.
        # Render has a nice feature: we can provide a default value that formats it.
      - key: VITE_API_URL
        value: https://ai-copilot-backend.onrender.com # Fallback explicit URL if dynamic host mapping has issues.
